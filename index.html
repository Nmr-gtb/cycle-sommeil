<html lang="fr">
<head>

<body>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root{
  --f:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',system-ui,sans-serif;
  --blue:#0B5FFF; --teal:#00BFC7; --green:#0FA958; --orange:#EF8A0C; --red:#E5484D;
  --r:18px;
}
:root[data-theme="light"]{
  --bg:#F1F4F9; --card:#FFFFFF; --fill:#EFF2F7; --fill2:#E6EAF1;
  --text:#0B1424; --muted:#6C7686; --sep:rgba(11,20,36,.07);
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.055);
  --chrome:rgba(241,244,249,.82); --tintbg:rgba(11,95,255,.08);
}
:root[data-theme="dark"]{
  --bg:#08090C; --card:#15181E; --fill:#1D212A; --fill2:#262B35;
  --text:#F3F6FA; --muted:#8D96A6; --sep:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.4); --chrome:rgba(8,9,12,.8); --tintbg:rgba(59,130,246,.16);
  --blue:#3B82F6; --teal:#22D3D9; --green:#30D158; --orange:#FF9F0A; --red:#FF453A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100dvh;overscroll-behavior-y:none}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mk{flex:none}
#app{max-width:440px;margin:0 auto;padding:0 16px 110px}

/* header */
header{position:sticky;top:0;z-index:5;margin:0 -16px;padding:14px 16px 12px;
  background:var(--chrome);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid transparent}
header.stuck{border-bottom-color:var(--sep)}
header h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
header .sb{font-size:13px;color:var(--muted);margin-top:2px;letter-spacing:-.005em}
.iconbtn{width:38px;height:38px;flex:none;border-radius:50%;border:none;background:var(--fill2);
  color:var(--text);display:grid;place-items:center;cursor:pointer;transition:.15s}
.iconbtn:active{transform:scale(.92)}
.iconbtn:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.sec{font-size:14px;font-weight:600;letter-spacing:-.015em;margin:26px 0 10px;display:flex;
  justify-content:space-between;align-items:baseline}
.sec span{font-size:13px;font-weight:400;color:var(--muted)}
.sec:first-child{margin-top:18px}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card+.card{margin-top:12px}
.flush{padding:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 18px}
.row+.row{border-top:1px solid var(--sep)}
.row .lb{font-size:14px;font-weight:500;letter-spacing:-.01em}
.row .hint{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.row .val{font-size:15px;color:var(--muted);display:flex;align-items:center;gap:5px;flex:none}

/* arc */
.hero{padding:14px 18px 20px}
.arcwrap{position:relative}
svg.arc{width:100%;display:block;touch-action:none}
.arc .hit{fill:transparent}
.knob{filter:drop-shadow(0 2px 6px rgba(16,24,40,.22));cursor:grab}
.center{position:absolute;left:0;right:0;bottom:4px;text-align:center;pointer-events:none}
.center .big{font-size:45px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:5px 11px;border-radius:999px;
  font-size:11.5px;font-weight:600;letter-spacing:-.005em}
.pill.ok{background:rgba(15,169,88,.12);color:var(--green)}
.pill.no{background:rgba(239,138,12,.13);color:var(--orange)}

.times{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tbox{background:var(--fill);border-radius:14px;padding:10px 8px 11px;text-align:center}
.tbox .k{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.01em;display:flex;
  align-items:center;justify-content:center;gap:5px}
.tbox .l{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.tbox .v{font-size:21px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.st{width:30px;height:30px;flex:none;border-radius:50%;border:none;background:var(--card);color:var(--text);
  font-size:16px;line-height:1;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.12);display:grid;place-items:center}
.st:active{transform:scale(.9)}

/* segmented */
.seg{display:flex;gap:0;background:var(--fill);border-radius:11px;padding:3px;flex:none}
.seg button{border:none;background:transparent;color:var(--muted);font-family:var(--f);font-size:13.5px;
  font-weight:500;padding:8px 14px;border-radius:9px;cursor:pointer;transition:.16s;letter-spacing:-.01em}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.14)}
.seg.full{display:grid;grid-template-columns:repeat(4,1fr);margin:0 18px 16px}
.seg.full button{padding:9px 0;text-align:center}

.cta{width:100%;margin-top:20px;border:none;border-radius:15px;padding:16px;cursor:pointer;background:var(--blue);
  color:#fff;font-family:var(--f);font-size:15px;font-weight:600;letter-spacing:-.01em}
.cta:active{opacity:.85}
.cta.sec2{background:var(--fill2);color:var(--text)}
.link{width:100%;margin-top:12px;background:none;border:none;color:var(--muted);font-family:var(--f);
  font-size:14px;cursor:pointer;padding:8px}
.link.danger{color:var(--red)}
.datebtn{position:relative;display:inline-flex;align-items:center;gap:6px;background:var(--fill);border:none;
  border-radius:999px;padding:7px 13px;font-family:var(--f);font-size:13px;color:var(--text);font-weight:500;cursor:pointer}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* stats */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.stat{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:15px 16px}
.stat .k{font-size:12px;color:var(--muted);font-weight:500;line-height:1.35;letter-spacing:-.005em}
.stat .v{font-size:23px;font-weight:700;letter-spacing:-.035em;margin-top:9px;line-height:1;font-variant-numeric:tabular-nums}
.stat .n{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.35}

/* anneau */
.ringrow{display:flex;align-items:center;gap:20px}
.ringrow .big{font-size:32px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.ringrow .sub{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.5}

/* graphique */
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:0 44px 10px 38px;
  font-variant-numeric:tabular-nums}
.brow{display:flex;align-items:center;height:26px}
.brow .d{width:38px;font-size:11.5px;color:var(--muted);flex:none}
.brow .h{width:44px;text-align:right;font-size:11.5px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.track{flex:1;height:100%;position:relative}
.gl{position:absolute;top:1px;bottom:1px;width:1px;background:var(--sep)}
.band{position:absolute;top:7px;height:12px;border-radius:6px;min-width:6px;
  background:linear-gradient(90deg,var(--blue),var(--teal))}
.band.s{opacity:.42}
.band .dot{position:absolute;right:-2px;top:-2px;width:16px;height:16px;border-radius:50%;
  background:var(--card);border:2.5px solid var(--orange)}

/* barres de durée */
.curve{width:100%;display:block;overflow:visible}
.curve .grid-l{stroke:var(--sep);stroke-width:1}
.curve .goal-l{stroke:color-mix(in srgb,var(--muted) 55%,transparent);stroke-width:1.5;stroke-dasharray:4 4}
.curve .line{fill:none;stroke:url(#gc);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.curve .pt{fill:var(--card);stroke:var(--blue);stroke-width:2.2}
.curve .pt.low{stroke:var(--orange)}
.curve .yl{fill:var(--muted);font-size:9.5px;font-family:var(--f)}
.curve .xl{fill:var(--muted);font-size:9.5px;font-family:var(--f);text-anchor:middle}
.curve .xl.we{fill:var(--orange);font-weight:600}
.curve .cl{font-size:10px;font-weight:600;font-family:var(--f)}
.curve .cv{font-size:9px;font-family:var(--f);opacity:.75}
.curve .lbed{fill:none;stroke:var(--blue);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.curve .lwake{fill:none;stroke:var(--green);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.curve .pb{fill:var(--card);stroke:var(--blue);stroke-width:2}
.curve .pw{fill:var(--card);stroke:var(--green);stroke-width:2}
.seg.per{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:10px}
.seg.per button{padding:8px 0;font-size:13px}
.item.ex{opacity:.45}
.item.ex .c{text-decoration:line-through}
.exbtn{background:none;border:none;color:var(--muted);font-size:11.5px;cursor:pointer;padding:3px 7px;
  border-radius:8px;flex:none;white-space:nowrap}
.exbtn.on{background:var(--fill2);color:var(--text);font-weight:500}
.trend{display:flex;align-items:baseline;gap:7px;margin-top:10px;white-space:nowrap;min-width:0}
.trend .v{font-size:19px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;flex:none}
.trend .hint{overflow:hidden;text-overflow:ellipsis}


/* insight */
.ins{display:flex;gap:14px;align-items:flex-start}
.tile{width:36px;height:36px;flex:none;border-radius:11px;display:grid;place-items:center}
.ins .t{font-size:15px;font-weight:600;letter-spacing:-.015em;margin-bottom:4px}
.ins .b{font-size:13.5px;line-height:1.5;color:var(--text)}
.ins .b em{font-style:normal;font-weight:600}
.ins .s{font-size:13px;color:var(--muted);line-height:1.5;margin-top:5px}

.item{display:flex;align-items:center;gap:12px;padding:13px 18px;font-size:13.5px}
.item+.item{border-top:1px solid var(--sep)}
.item .dt{width:58px;flex:none;color:var(--muted);font-size:13px}
.item .c{flex:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.item .x{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 2px;line-height:1}
.empty{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;padding:26px 14px}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:12px;padding:0 4px}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);
  padding:9px 12px;background:var(--fill);border-radius:12px;margin-top:12px}
.sync .dotk{width:7px;height:7px;border-radius:50%;flex:none;background:var(--green)}
.sync .dotk.off{background:var(--muted)} .sync .dotk.err{background:var(--orange)}
.keybox{font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.02em;word-break:break-all;
  background:var(--fill);border-radius:12px;padding:12px 14px;margin-top:10px;line-height:1.6;color:var(--text)}
.kf{width:100%;background:var(--fill);border:none;border-radius:12px;padding:13px 14px;color:var(--text);
  font-family:ui-monospace,Menlo,monospace;font-size:13px;margin-top:10px}
.kf:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.bilan{font-size:14px;line-height:1.65;color:var(--text)}
.bilan p{margin:0 0 12px}
.bilan p:last-child{margin-bottom:0}
.bilan strong{font-weight:600}
.bilan .h{font-weight:600;font-size:14.5px;letter-spacing:-.01em;margin:16px 0 6px;display:block}
.bilan .h:first-child{margin-top:0}
.stamp{font-size:12px;color:var(--muted);margin-top:14px}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--fill2);
  border-top-color:var(--blue);animation:sp .7s linear infinite;display:inline-block;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}

input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:var(--fill2);margin:18px 0 2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
  background:#fff;box-shadow:0 1px 5px rgba(16,24,40,.3);cursor:pointer}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;
  background:var(--chrome);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  border-top:1px solid var(--sep);padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;width:100%;max-width:440px}
nav button{flex:1;background:none;border:none;color:var(--muted);padding:9px 0 11px;cursor:pointer;
  font-family:var(--f);font-size:10.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--blue)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:9;background:var(--text);color:var(--bg);
  padding:12px 20px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;transition:.22s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <header id="hd">
    <div class="brand"><svg class="mk" viewBox="0 0 120 120" width="30" height="30" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--blue)"/><stop offset="1" stop-color="var(--teal)"/></linearGradient></defs><g fill="none" stroke="url(#lg)" stroke-width="9" stroke-linecap="round"><path d="M60 60 A24 24 0 0 1 106.57 48.39"/><path d="M60 60 A24 24 0 0 1 93.34 94.53"/><path d="M60 60 A24 24 0 0 1 46.77 106.14"/><path d="M60 60 A24 24 0 0 1 13.43 71.61"/><path d="M60 60 A24 24 0 0 1 26.66 25.47"/><path d="M60 60 A24 24 0 0 1 73.23 13.86"/></g></svg><div><h1 id="ttl">Ce matin</h1><div class="sb" id="sub"></div></div></div>
    <button class="iconbtn" id="theme" aria-label="Changer de thème"></button>
  </header>
  <main id="view"></main>
</div>
<nav><div class="in"></div></nav>

<script>
const KEY='sommeil-v2';
const DAY=['dim','lun','mar','mer','jeu','ven','sam'];
const FULL=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const SPAN=1080;

const I={
  moon:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>',
  sun:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.1 5.1l1.4 1.4M17.5 17.5l1.4 1.4M18.9 5.1l-1.4 1.4M6.5 17.5l-1.4 1.4"/></svg>',
  chart:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>',
  bed:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>',
  spark:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg>',
  chev:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  clock:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8" stroke-linecap="round"/></svg>',

  cal:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/></svg>',
  wave:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3 12c2-5 4 5 6 0s4 5 6 0 4 3 6 0"/></svg>',
  down:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l6 6 4-4 6 6"/><path d="M20 15v-4h-4"/></svg>'
};

let S={nights:[],target:480,theme:'light',tab:'log',ready:false,ask:false,confirm:false,key:null,sync:'off',syncAt:0,showKey:false,keyMsg:'',touched:false,bilan:null,bilanAt:null,bilanEtat:'',bilanErr:'',periode:14};
let d=null;

const pad=n=>String(n).padStart(2,'0');
const toMin=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};
const fromMin=m=>{m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const ax=t=>{let m=toMin(t)-1080;if(m<0)m+=1440;return m};
const unax=p=>fromMin(p+1080);
const dur=n=>{let x=toMin(n.wake)-toMin(n.bed);if(x<=0)x+=1440;return x};
const hm=m=>{m=Math.round(m);const s=m<0?'-':'';m=Math.abs(m);return s+Math.floor(m/60)+'h'+pad(m%60)};
const sh=m=>{m=Math.round(m);const s=m<0?'-':'';m=Math.abs(m);const h=Math.floor(m/60);return h?s+h+'h'+pad(m%60):s+m+' min'};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const sd=a=>{if(a.length<2)return 0;const m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)))};
const iso=t=>t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
const today=()=>iso(new Date());
const lab=s=>{const t=new Date(s+'T12:00');return DAY[t.getDay()]+' '+pad(t.getDate())};
const longLab=s=>{const t=new Date(s+'T12:00');
  return s===today()?"Aujourd'hui":t.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'})};
const sorted=()=>[...S.nights].sort((a,b)=>a.date<b.date?1:-1);
// Toutes les statistiques ignorent les nuits mises de cote.
const retenues=()=>sorted().filter(n=>!n.excluded);
// Fenetre d'observation choisie par l'utilisateur.
function fenetre(){
  const ns=retenues();
  return S.periode==='tout' ? ns : ns.slice(0,S.periode);
}
const saved=()=>d&&S.nights.some(n=>n.date===d.date);
const tint=(c,a)=>'style="background:color-mix(in srgb,'+c+' 14%,transparent);color:'+c+'"';

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}

const SB={
  url:'https://hnvforrduqynytrzkwnu.supabase.co',
  key:'sb_publishable_yZj7yvVnytRLy3rN4xpkWw_ns15xtWE'
};
const KKEY='cycle-sync-key';

function newKey(){
  const a=new Uint8Array(24);crypto.getRandomValues(a);
  return [...a].map(x=>x.toString(36).padStart(2,'0')).join('').slice(0,32);
}
function getKey(){
  let k=null;
  try{k=localStorage.getItem(KKEY)}catch(e){}
  if(!k){k=newKey();try{localStorage.setItem(KKEY,k)}catch(e){}}
  return k;
}
function setKey(k){
  try{localStorage.setItem(KKEY,k)}catch(e){}
  S.key=k;
}
async function sbFetch(path,opts){
  const o=opts||{};
  const r=await fetch(SB.url+'/rest/v1/'+path,{
    method:o.method||'GET',
    headers:Object.assign({
      'apikey':SB.key,
      'Authorization':'Bearer '+SB.key,
      'x-sync-key':S.key,
      'Content-Type':'application/json'
    },o.headers||{}),
    body:o.body?JSON.stringify(o.body):undefined
  });
  if(!r.ok)throw new Error(r.status+' '+await r.text());
  return r.status===204?null:r.json();
}
const toRow=n=>({sync_key:S.key,night_date:n.date,bed:n.bed,wake:n.wake,
  wake_type:n.wakeType||'alarme',awak:n.awak||0,excluded:!!n.excluded,updated_at:n.up||new Date().toISOString()});
const fromRow=r=>({id:'s'+r.night_date,date:r.night_date,bed:r.bed.slice(0,5),wake:r.wake.slice(0,5),
  wakeType:r.wake_type,awak:r.awak,excluded:!!r.excluded,up:r.updated_at});

async function push(){
  if(!navigator.onLine)return;
  S.sync='busy';paintSync();
  try{
    if(S.nights.length){
      await sbFetch('cycle_nights?on_conflict=sync_key,night_date',
        {method:'POST',body:S.nights.map(toRow),
         headers:{'Prefer':'resolution=merge-duplicates'}});
    }
    await sbFetch('cycle_prefs?on_conflict=sync_key',
      {method:'POST',body:[{sync_key:S.key,target:S.target,theme:S.theme,updated_at:new Date().toISOString()}],
       headers:{'Prefer':'resolution=merge-duplicates'}});
    S.sync='ok';S.syncAt=Date.now();
  }catch(e){S.sync='err';console.warn('sync',e)}
  paintSync();
}
async function pull(){
  if(!navigator.onLine){S.sync='off';return paintSync()}
  S.sync='busy';paintSync();
  try{
    const rows=await sbFetch('cycle_nights?select=*&order=night_date.desc');
    const local=new Map(S.nights.map(n=>[n.date,n]));
    rows.forEach(r=>{
      const l=local.get(r.night_date);
      // sans horodatage local, la version serveur fait foi
      if(!l||!l.up||(r.updated_at||'')>l.up)local.set(r.night_date,fromRow(r));
    });
    S.nights=[...local.values()];
    const p=await sbFetch('cycle_prefs?select=*&limit=1');
    if(p&&p.length){S.target=p[0].target;if(p[0].bilan){S.bilan=p[0].bilan;S.bilanAt=p[0].bilan_at}}
    save();S.sync='ok';S.syncAt=Date.now();
  }catch(e){S.sync='err';console.warn('sync',e)}
  paintSync();
}
// Rendu markdown minimal : titres en gras et paragraphes, rien de plus.
function miniMd(t){
  const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc(t).split(/\n{2,}/).map(bloc=>{
    const l=bloc.trim();
    if(!l)return '';
    const titre=l.match(/^(?:#{1,4}\s*)?\*\*(.+?)\*\*:?\s*$/);
    if(titre)return '<span class="h">'+titre[1]+'</span>';
    if(/^#{1,4}\s/.test(l))return '<span class="h">'+l.replace(/^#{1,4}\s*/,'')+'</span>';
    return '<p>'+l.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')+'</p>';
  }).join('');
}
async function genererBilan(force){
  S.bilanEtat='busy';S.bilanErr='';render();
  try{
    const r=await fetch('/api/bilan',{method:'POST',
      headers:{'Content-Type':'application/json','x-sync-key':S.key},
      body:JSON.stringify({force:!!force})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.erreur||'erreur '+r.status);
    S.bilan=j.bilan;S.bilanAt=j.genere_le;S.bilanEtat='';
  }catch(e){S.bilanEtat='';S.bilanErr=e.message}
  render();
}
async function syncNow(){await pull();await push();if(!S.touched)d=null;render()}

function paintSync(){
  document.querySelectorAll('[data-sync]').forEach(el=>{
    const st=S.sync, cls=st==='ok'?'':st==='err'?'err':'off';
    el.innerHTML='<span class="dotk '+cls+'"></span>'+(
      st==='busy'?'Synchronisation en cours…':
      st==='ok'?'Synchronisé'+(S.syncAt?' à '+new Date(S.syncAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):''):
      st==='err'?'Hors ligne, tes nuits restent sur cet appareil':
      'Pas encore synchronisé');
  });
}

function load(){
  try{const raw=localStorage.getItem(KEY);
    if(raw){const v=JSON.parse(raw);S.nights=v.nights||[];S.target=v.target||480;S.theme=v.theme||'light'}
  }catch(e){}
  document.documentElement.dataset.theme=S.theme;setMeta();
  S.key=getKey();
  S.ready=true;render(1);
  syncNow();

function save(){
  try{localStorage.setItem(KEY,JSON.stringify({nights:S.nights,target:S.target,theme:S.theme}))}

}
function blank(date){
  const dt=date||today(),ex=S.nights.find(n=>n.date===dt);
  if(ex)return{...ex};
  const last=sorted()[0];
  return{id:'n'+Date.now(),date:dt,bed:last?last.bed:'23:30',wake:last?last.wake:'07:30',wakeType:'alarme',awak:0};
}

  const x=(e.clientX-r.left)*sc,y=(e.clientY-r.top)*sc;

/* courbe de duree, spline lissee */
function buildCurve(ns){
  const W=320,H=170,L=34,R=8,T=12,B=26;
  if(!ns.length)return '<div class="empty">Aucune nuit pour le moment.</div>';
  if(ns.length===1)return '<div class="empty">Une seule nuit enregistrée.<br>La courbe apparaîtra dès la deuxième.</div>';
  const vals=ns.map(dur);
  let lo=Math.min(S.target,...vals)-40, hi=Math.max(S.target,...vals)+40;
  lo=Math.max(0,Math.floor(lo/60)*60); hi=Math.ceil(hi/60)*60;
  if(hi-lo<120)hi=lo+120;
  const X=i=>L+(W-L-R)*(ns.length===1?.5:i/(ns.length-1));
  const Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const pts=vals.map((v,i)=>[X(i),Y(v)]);
  let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||pts[i+1];
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=' C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+','+c2x.toFixed(1)+' '+c2y.toFixed(1)+','+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  const area=d+' L'+pts[pts.length-1][0].toFixed(1)+' '+(H-B)+' L'+pts[0][0].toFixed(1)+' '+(H-B)+' Z';
  let g='';
  for(let v=lo;v<=hi;v+=60){
    const y=Y(v);
    g+='<line class="grid-l" x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'"/>'
     +'<text class="yl" x="'+(L-7)+'" y="'+(y+3.3).toFixed(1)+'" text-anchor="end">'+Math.round(v/60)+'h</text>';
  }
  const yg=Y(S.target);
  const goal='<line class="goal-l" x1="'+L+'" y1="'+yg.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yg.toFixed(1)+'"/>';
  const dots=pts.map((p,i)=>'<circle class="pt'+(vals[i]<S.target?' low':'')+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.6"/>').join('');
  const step=ns.length>9?2:1;
  const xl=ns.map((n,i)=>{
    if(i%step)return '';
    const g=new Date(n.date+'T12:00').getDay();
    return '<text class="xl'+([0,6].includes(g)?' we':'')+'" x="'+X(i).toFixed(1)+'" y="'+(H-8)+'">'+DAY[g][0].toUpperCase()+'</text>';
  }).join('');
  return '<svg class="curve" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:170px">'
    +'<defs><linearGradient id="gc" x1="0" y1="0" x2="1" y2="0">'
    +'<stop offset="0" stop-color="var(--blue)"/><stop offset="1" stop-color="var(--teal)"/></linearGradient>'
    +'<linearGradient id="ga2" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0" stop-color="var(--blue)" stop-opacity=".18"/>'
    +'<stop offset="1" stop-color="var(--blue)" stop-opacity="0"/></linearGradient></defs>'
    +g+goal+'<path d="'+area+'" fill="url(#ga2)"/><path class="line" d="'+d+'"/>'+dots+xl+'</svg>';
}

// Coucher et lever sur un axe horaire. La bande entre les deux EST la nuit :
// sa position montre quand tu dors, son epaisseur combien de temps.
function buildHoraires(ns){
  const W=320,H=210,L=44,R=52,T=14,B=26;
  if(ns.length<2)return '<div class="empty">Il faut au moins deux nuits pour tracer tes horaires.</div>';
  const beds=ns.map(n=>ax(n.bed)), wakes=ns.map(n=>ax(n.wake));
  let lo=Math.min(...beds)-40, hi=Math.max(...wakes)+40;
  lo=Math.max(0,Math.floor(lo/60)*60); hi=Math.min(1080,Math.ceil(hi/60)*60);
  if(hi-lo<240)hi=Math.min(1080,lo+240);
  const pas=(hi-lo)>420?120:60;                      // une graduation toutes les 1 ou 2 h
  const X=i=>L+(W-L-R)*(ns.length===1?.5:i/(ns.length-1));
  const Y=v=>T+(H-T-B)*((v-lo)/(hi-lo));
  const spline=p=>{
    let d='M'+p[0][0].toFixed(1)+' '+p[0][1].toFixed(1);
    for(let i=0;i<p.length-1;i++){
      const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||p[i+1];
      d+=' C'+(b[0]+(c[0]-a[0])/6).toFixed(1)+' '+(b[1]+(c[1]-a[1])/6).toFixed(1)+','
        +(c[0]-(e[0]-b[0])/6).toFixed(1)+' '+(c[1]-(e[1]-b[1])/6).toFixed(1)+','
        +c[0].toFixed(1)+' '+c[1].toFixed(1);
    }
    return d;
  };
  const pb=beds.map((v,i)=>[X(i),Y(v)]), pw=wakes.map((v,i)=>[X(i),Y(v)]);
  const aire=spline(pb)+' L'+pw[pw.length-1][0].toFixed(1)+' '+pw[pw.length-1][1].toFixed(1)
    +' '+spline([...pw].reverse()).slice(1)+' Z';

  let g='';
  for(let v=lo;v<=hi;v+=pas){
    const y=Y(v);
    g+='<line class="grid-l" x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'"/>'
     +'<text class="yl" x="'+(L-8)+'" y="'+(y+3.3).toFixed(1)+'" text-anchor="end">'+unax(v)+'</text>';
  }
  // Moyennes, en pointilles, pour juger l'ecart d'un coup d'oeil.
  const mb=avg(beds), mw=avg(wakes);
  const moyennes=
     '<line x1="'+L+'" y1="'+Y(mb).toFixed(1)+'" x2="'+(W-R)+'" y2="'+Y(mb).toFixed(1)+'" stroke="var(--blue)" stroke-width="1" stroke-dasharray="3 4" opacity=".45"/>'
    +'<line x1="'+L+'" y1="'+Y(mw).toFixed(1)+'" x2="'+(W-R)+'" y2="'+Y(mw).toFixed(1)+'" stroke="var(--green)" stroke-width="1" stroke-dasharray="3 4" opacity=".45"/>';

  const dots=pb.map(p=>'<circle class="pb" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3"/>').join('')
    +pw.map(p=>'<circle class="pw" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3"/>').join('');

  // Les noms sont ecrits au bout des courbes : plus besoin de chercher dans une legende.
  const bout=W-R+6;
  const noms=
     '<text class="cl" x="'+bout+'" y="'+(pb[pb.length-1][1]-4).toFixed(1)+'" fill="var(--blue)">Coucher</text>'
    +'<text class="cv" x="'+bout+'" y="'+(pb[pb.length-1][1]+8).toFixed(1)+'" fill="var(--blue)">'+unax(mb)+' moy.</text>'
    +'<text class="cl" x="'+bout+'" y="'+(pw[pw.length-1][1]-4).toFixed(1)+'" fill="var(--green)">Lever</text>'
    +'<text class="cv" x="'+bout+'" y="'+(pw[pw.length-1][1]+8).toFixed(1)+'" fill="var(--green)">'+unax(mw)+' moy.</text>';

  const step=ns.length>8?Math.ceil(ns.length/6):1;
  const xl=ns.map((n,i)=>{
    if(i%step)return '';
    const j=new Date(n.date+'T12:00').getDay();
    return '<text class="xl'+([0,6].includes(j)?' we':'')+'" x="'+X(i).toFixed(1)+'" y="'+(H-8)+'">'+lab(n.date).slice(-2)+'</text>';
  }).join('');

  return '<svg class="curve" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:210px">'
    +g+'<path d="'+aire+'" fill="var(--blue)" opacity=".10"/>'+moyennes
    +'<path class="lbed" d="'+spline(pb)+'"/><path class="lwake" d="'+spline(pw)+'"/>'
    +dots+noms+xl+'</svg>';
}

      <svg width="116" height="116" viewBox="0 0 116 116">
        <defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="var(--blue)"/><stop offset="1" stop-color="var(--teal)"/></linearGradient></defs>
        <circle cx="58" cy="58" r="50" fill="none" stroke="var(--fill)" stroke-width="11"/>
        <circle cx="58" cy="58" r="50" fill="none" stroke="url(#g2)" stroke-width="11" stroke-linecap="round"
          stroke-dasharray="${(C*p).toFixed(1)} ${C}" transform="rotate(-90 58 58)"/>
      </svg>
      <div><div class="big">${hm(moy)}</div>
        <div class="sub">de sommeil en moyenne<br>sur ${nb} nuit${nb>1?'s':''}, ${libelle}<br>Objectif ${hm(S.target)}</div></div>
    </div>
    ${delta!==null?`<div class="trend"><span class="v" style="color:${delta>=0?'var(--green)':'var(--orange)'}">${delta>=0?'+':''}${sh(delta)}</span>
      <span class="hint">vs la période précédente</span></div>`:''}
  </div>

  <div class="sec">Les chiffres</div>
  <div class="grid">
    <div class="stat"><div class="k">Dette de sommeil</div>
      <div class="v" style="color:${dette<0?'var(--orange)':'var(--green)'}">${sh(dette)}</div>
      <div class="n">cumul sur ${nb} nuit${nb>1?'s':''}</div></div>
    <div class="stat"><div class="k">Coucher</div><div class="v">${unax(avg(beds))}</div>
      <div class="n">en moyenne, à ${Math.round(sd(beds))} min près</div></div>
    <div class="stat"><div class="k">Réveil moyen</div><div class="v">${unax(avg(wakes))}</div>
      <div class="n">en moyenne, à ${Math.round(sd(wakes))} min près</div></div>
    <div class="stat"><div class="k">Sous l'objectif</div><div class="v">${dur7.filter(x=>x<S.target).length}<span style="font-size:17px;color:var(--muted)">/${nb}</span></div>
      <div class="n">nuits trop courtes</div></div>
  </div>

  <div class="sec">Durée par nuit</div>
  <div class="card" style="padding:18px 14px 12px">${buildCurve(chrono)}</div>
  <div class="note">${chrono.length<2?'La courbe apparaîtra dès deux nuits enregistrées.':'La ligne pointillée est ton objectif. Les points orange sont les nuits passées en dessous.'}</div>

  <div class="sec">Tes horaires</div>
  <div class="card" style="padding:18px 14px 12px">${buildHoraires(chrono)}</div>
  <div class="note">La bande bleue, c'est ta nuit : sa position dit quand tu dors, son épaisseur combien de temps. Plus les courbes sont plates, plus ton rythme est régulier. Les pointillés sont tes moyennes.</div>

  <div class="sec">Tes nuits sur l'horloge</div>
  <div class="card" style="padding:18px 16px 14px">
    <div class="axis"><span>18h</span><span>0h</span><span>6h</span><span>12h</span></div>
    ${rows}
  </div>
  <div class="note">Chaque barre part de ton coucher et s'arrête au réveil. Le point orange marque une nuit avec réveils.</div>

  <div class="sec">Historique<span>${exclues?exclues+' nuit'+(exclues>1?'s':'')+' mise'+(exclues>1?'s':'')+' de côté':'toutes comptées'}</span></div>
  <div class="card flush">${tous.slice(0,60).map(n=>'<div class="item'+(n.excluded?' ex':'')+'"><span class="dt">'+lab(n.date)+
    '</span><span class="c">'+n.bed+' → '+n.wake+' · '+hm(dur(n))+(n.awak?' · '+n.awak+' réveil'+(n.awak>1?'s':''):'')+
    (n.wakeType==='naturel'?' · sans alarme':'')+'</span>'+
    '<button class="exbtn'+(n.excluded?' on':'')+'" data-exc="'+n.id+'">'+(n.excluded?'exclue':'exclure')+'</button>'+
    '<button class="x" data-del="'+n.id+'">×</button></div>').join('')}</div>
  <div class="note">Une soirée, une nuit de voyage, une insomnie unique : mets-la de côté avec "exclure". Elle reste dans ton historique mais ne fausse plus aucune moyenne.</div>
  <button class="link" id="csv">Exporter en CSV</button>`;
}

/* ---------- écran 3 ---------- */
function vAn(){
  const n=retenues().length;
  return `
  <div class="sec">Bilan personnalisé</div>
  <div class="card">
    ${S.bilanEtat==='busy'
      ? '<div class="hint"><span class="spin"></span>Lecture de tes nuits en cours…</div>'
      : S.bilan
        ? '<div class="bilan">'+miniMd(S.bilan)+'</div>'
          +'<div class="stamp">Rédigé le '+new Date(S.bilanAt).toLocaleDateString('fr-FR',{day:'numeric',month:'long'})
          +' à '+new Date(S.bilanAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'</div>'
          +'<button class="link" id="regen">Refaire le bilan</button>'
        : n<7
          ? '<div class="empty">Il faut au moins 7 nuits pour un bilan utile.<br>Tu en as '+n+'.</div>'
          : '<div class="hint">Un bilan écrit à partir de tes nuits : ce qui ressort, pourquoi, et une action pour la semaine.</div>'
            +'<button class="cta" id="genBilan">Générer mon bilan</button>'}
    ${S.bilanErr?'<div class="hint" style="margin-top:12px;color:var(--orange)">'+S.bilanErr+'</div>':''}
  </div>
  <div class="note">Ce bilan est rédigé automatiquement à partir de tes données, hors nuits mises de côté. Il décrit, il ne diagnostique pas.</div>

  <div class="sec">Ton objectif</div>
  <div class="card">
    <div class="row" style="padding:0">
      <div><div class="lb" id="tgv">${hm(S.target)} par nuit</div>
      <div class="hint">La recommandation pour 18 à 25 ans va de 7h à 9h</div></div></div>
    <input type="range" min="360" max="600" step="15" value="${S.target}" id="tg">
  </div>
  <div class="note">Cette app décrit tes nuits, elle ne pose aucun diagnostic. Si la fatigue s'installe sur plusieurs semaines, un médecin reste le bon interlocuteur.</div>

  <div class="sec">Sauvegarde</div>
  <div class="card">
    <div class="row" style="padding:0">
      <div><div class="lb">Synchronisation</div>
      <div class="hint">Tes nuits sont sauvegardées en ligne et sur cet appareil</div></div></div>
    <div class="sync" data-sync></div>
    ${S.showKey?`
      <div class="hint" style="margin-top:14px">Ta clé de synchronisation. Saisis-la sur un autre appareil pour y retrouver tes nuits. Garde-la pour toi, elle donne accès à tes données.</div>
      <div class="keybox">${S.key}</div>
      <button class="link" id="copyKey" style="margin-top:4px">Copier la clé</button>
      <div class="hint" style="margin-top:10px">Ou colle ici la clé d'un appareil existant :</div>
      <input class="kf" id="kin" placeholder="clé de synchronisation" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="cta" id="useKey" style="margin-top:10px">Utiliser cette clé</button>
      ${S.keyMsg?'<div class="hint" style="margin-top:10px;color:var(--orange)">'+S.keyMsg+'</div>':''}`
    :'<button class="link" id="showKey">Voir ma clé de synchronisation</button>'}
  </div>
  <button class="link danger" id="reset">${S.confirm?'Confirmer, tout effacer':'Effacer toutes mes données'}</button>`;
}

/* ---------- rendu ---------- */
const TABS=[['log','Ce matin',I.bed],['nights','Mes nuits',I.chart],['an','Analyse',I.spark]];
function render(scroll){
  const v=document.getElementById('view');
  document.getElementById('theme').innerHTML=S.theme==='light'?I.moon:I.sun;
  document.querySelector('nav .in').innerHTML=TABS.map(t=>
    '<button data-tab="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[2]+t[1]+'</button>').join('');
  if(!S.ready){v.innerHTML='<div class="card"><div class="empty">Chargement…</div></div>';return}
  if(!d)d=blank();
  document.getElementById('ttl').textContent=S.tab==='log'?'Ce matin':S.tab==='nights'?'Mes nuits':'Analyse';
  document.getElementById('sub').textContent=S.tab==='log'
    ?(saved()?'Nuit enregistrée':'Deux réglages et c\'est plié')
    :retenues().length+' nuit'+(retenues().length>1?'s':'')+' suivie'+(retenues().length>1?'s':'');
  v.innerHTML=S.tab==='log'?vLog():S.tab==='nights'?vNights():vAn();
  if(S.tab==='log')paint();
  paintSync();
  if(scroll)window.scrollTo(0,0);
}
addEventListener('scroll',()=>document.getElementById('hd').classList.toggle('stuck',scrollY>6));

document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='theme'){S.theme=S.theme==='light'?'dark':'light';document.documentElement.dataset.theme=S.theme;setMeta();
    b.innerHTML=S.theme==='light'?I.moon:I.sun;return save()}
  if(b.dataset.tab){S.tab=b.dataset.tab;S.confirm=false;return render(1)}
  if(b.dataset.step){S.touched=true;const[f,v]=b.dataset.step.split(':');let m=ax(d[f])+Number(v);
    m=f==='bed'?Math.min(m,ax(d.wake)-30):Math.max(m,ax(d.bed)+30);
    d[f]=unax(Math.min(SPAN,Math.max(0,m)));return paint()}
  if(b.dataset.set){S.touched=true;d[b.dataset.set]=b.dataset.set==='awak'?Number(b.dataset.v):b.dataset.v;return render()}
  if(b.id==='openAwak'){S.ask=true;return render()}
  if(b.dataset.per){S.periode=b.dataset.per==='tout'?'tout':Number(b.dataset.per);return render(1)}
  if(b.dataset.exc){
    const g=S.nights.find(n=>n.id===b.dataset.exc);
    if(g){g.excluded=!g.excluded;g.up=new Date().toISOString();save();push();
      toast(g.excluded?'Nuit mise de côté':'Nuit réintégrée')}
    return render()}
  if(b.id==='genBilan'){return genererBilan(false)}
  if(b.id==='regen'){return genererBilan(true)}
  if(b.id==='showKey'){S.showKey=true;S.keyMsg='';return render()}
  if(b.id==='copyKey'){navigator.clipboard.writeText(S.key).then(()=>toast('Clé copiée')).catch(()=>toast('Copie impossible'));return}
  if(b.id==='useKey'){
    const v=(document.getElementById('kin').value||'').trim();
    if(v.length<24){S.keyMsg='Cette clé est trop courte, vérifie que tu l\'as copiée en entier.';return render()}
    if(v===S.key){S.keyMsg='C\'est déjà la clé de cet appareil.';return render()}
    const garde=S.nights.slice();
    setKey(v);S.keyMsg='';
    await pull();
    const parDate=new Map(S.nights.map(n=>[n.date,n]));
    garde.forEach(n=>{if(!parDate.has(n.date))parDate.set(n.date,n)});
    S.nights=[...parDate.values()];
    save();await push();
    toast('Clé changée, '+S.nights.length+' nuits');return render()}
  if(b.id==='go'){const up=saved();
    S.nights=S.nights.filter(n=>n.date!==d.date).concat({...d,up:new Date().toISOString()});
    await save();push();toast(up?'Nuit mise à jour':'Nuit enregistrée');
    S.ask=false;S.touched=false;d=null;S.tab='nights';return render(1)}
  if(b.id==='rm'){const dt=d.date;S.nights=S.nights.filter(n=>n.date!==dt);await save();
    sbFetch('cycle_nights?night_date=eq.'+dt,{method:'DELETE'}).catch(()=>{});
    d=blank(dt);toast('Supprimée');return render()}
  if(b.dataset.del){const g=S.nights.find(n=>n.id===b.dataset.del);
    S.nights=S.nights.filter(n=>n.id!==b.dataset.del);await save();
    if(g)sbFetch('cycle_nights?night_date=eq.'+g.date,{method:'DELETE'}).catch(()=>{});
    d=null;toast('Supprimée');return render()}
  if(b.id==='csv'){const rows=[['date','coucher','reveil','duree_min','reveils_nuit','type_reveil']]
      .concat(sorted().map(n=>[n.date,n.bed,n.wake,dur(n),n.awak||0,n.wakeType]));
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(';')).join('\n')],{type:'text/csv'}));
    a.download='sommeil.csv';a.click();return toast('CSV exporté')}
  if(b.id==='reset'){if(!S.confirm){S.confirm=true;return render()}
    S.nights=[];S.confirm=false;d=null;await save();
    sbFetch('cycle_nights?sync_key=eq.'+S.key,{method:'DELETE'}).catch(()=>{});
    toast('Données effacées');return render()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='tg'){S.target=Number(e.target.value);document.getElementById('tgv').textContent=hm(S.target)+' par nuit'}
  if(e.target.id==='dpick'&&e.target.value){S.ask=false;S.touched=false;d=blank(e.target.value);render()}
});
document.addEventListener('change',e=>{if(e.target.id==='tg'){save();push()}});
load();
</script>

<script>
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
